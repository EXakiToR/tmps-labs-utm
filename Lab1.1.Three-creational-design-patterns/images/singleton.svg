<rect x="510" y="110" width="450" height="60" fill="#dbeafe" stroke="#334155"/>
<text x="522" y="131" class="">«sealed / Singleton»</text>
<text x="522" y="157" class="">GameJournal</text>
<text x="522" y="194" class="">- _instance: Lazy&lt;GameJournal&gt; {static}</text>
<text x="522" y="217" class="">- _entries: List&lt;string&gt;</text>
<text x="522" y="240" class="">- _gate: object</text>
<path d="M510,251 H960" stroke="#334155"/>
<text x="522" y="275" class="">- GameJournal()</text>
<text x="522" y="298" class="">+ Instance: GameJournal {static, get}</text>
<text x="522" y="321" class="">+ Record(entry: string): void</text>
<text x="522" y="344" class="">+ GetEntries(): IReadOnlyList&lt;string&gt;</text>
<path d="M290,160 H510" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="335" y="148" class="label">reads Instance</text>
<path d="M290,370 H400 V300 H510" fill="none" stroke="#334155" stroke-width="1.5" stroke-dasharray="7 5" marker-end="url(#arrow)"/>
<text x="310" y="355" class="label">records events</text>
<text x="30" y="485" class="label">Dashed arrow: dependency. + public; - private; {static} class-level member.</text>
<text x="30" y="512" class="label">Lazy&lt;T&gt; creates one instance; a lock protects journal writes and snapshots.</text>
